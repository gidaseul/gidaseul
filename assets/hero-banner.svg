<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="gidaseul — Applied AI Engineer">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#191d16" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#3d4738"/>
    </marker>
    <path id="flow" d="M 700 175 L 780 120 L 860 175 L 940 120 L 1020 175 L 1100 120"/>
    <style>
      text { font-family: "JetBrains Mono","SF Mono","Fira Code",ui-monospace,monospace; }
      .blink { animation: blink 1.1s steps(2,jump-none) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="240" fill="#0e120c"/>
  <rect width="1200" height="240" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="239" fill="none" stroke="#1c2118" stroke-width="1"/>
  <line x1="660" y1="0" x2="660" y2="240" stroke="#1c2118" stroke-width="1"/>

  <!-- left: identity -->
  <g transform="translate(48,58)">
    <text x="0" y="0" fill="#5c7452" font-size="12" letter-spacing="2">~ % whoami</text>
    <text x="0" y="42" fill="#f2efe4" font-size="38" font-weight="700">gidaseul</text>
    <text x="0" y="70" fill="#e0a83a" font-size="15" letter-spacing="0.5">Applied AI Engineer</text>
    <text x="0" y="104" fill="#8a9682" font-size="13">문제 정의 → 모델/파이프라인 구현 → 실패 분석 → 배포까지</text>
    <text x="0" y="124" fill="#6b7a63" font-size="13">직접 검증하고 근거를 남기는 방식으로 작업합니다.</text>
    <rect x="0" y="134" width="8" height="14" fill="#e0a83a" class="blink"/>
  </g>

  <!-- right: the case-study method, drawn once, understated -->
  <g font-size="10.5" fill="#7d8a75">
    <use href="#flow" fill="none" stroke="#2e3729" stroke-width="1.4" marker-end="url(#arrow)"/>
    <circle r="3.5" fill="#e0a83a" opacity="0.9">
      <animateMotion dur="9s" repeatCount="indefinite">
        <mpath href="#flow"/>
      </animateMotion>
    </circle>

    <g transform="translate(700,175)"><circle r="5" fill="#0e120c" stroke="#b56a72" stroke-width="1.3"/><text x="0" y="22" text-anchor="middle" fill="#b56a72">PROBLEM</text></g>
    <g transform="translate(780,120)"><circle r="5" fill="#0e120c" stroke="#4f8f7c" stroke-width="1.3"/><text x="0" y="-14" text-anchor="middle" fill="#4f8f7c">ROLE</text></g>
    <g transform="translate(860,175)"><circle r="5" fill="#0e120c" stroke="#e0a83a" stroke-width="1.3"/><text x="0" y="22" text-anchor="middle" fill="#e0a83a">SOLUTION</text></g>
    <g transform="translate(940,120)"><circle r="5" fill="#0e120c" stroke="#6fa060" stroke-width="1.3"/><text x="0" y="-14" text-anchor="middle" fill="#6fa060">RESULT</text></g>
    <g transform="translate(1020,175)"><circle r="5" fill="#0e120c" stroke="#7d8a9a" stroke-width="1.3"/><text x="0" y="22" text-anchor="middle" fill="#7d8a9a">EVIDENCE</text></g>
    <g transform="translate(1100,120)"><circle r="5" fill="#0e120c" stroke="#7d8a75" stroke-width="1.3"/><text x="0" y="-14" text-anchor="middle" fill="#7d8a75">LIMITS</text></g>

    <text x="900" y="215" text-anchor="middle" fill="#454f40" font-size="10" letter-spacing="1.2">이 순서를 모든 케이스 스터디에 그대로 적용합니다</text>
  </g>
</svg>
